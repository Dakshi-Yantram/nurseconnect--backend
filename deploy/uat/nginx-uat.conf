# /etc/nginx/conf.d/uat.conf  (replace staging-api.nurseconnect.co.in with your hostname)
map $http_x_forwarded_proto $uat_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name staging-api.nurseconnect.co.in;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $uat_proto;
        proxy_read_timeout 60s;
    }
}
